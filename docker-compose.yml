# Carbo MCP Gateway stack.
#
# Three services, deliberately isolated from every other stack on this host:
#   carbo-mcp      the read-only MCP gateway (distroless, read-only, no caps)
#   carbo-keycloak the OAuth 2.1 authorization server
#   carbo-keycloak-db  Postgres, reachable only on the internal network
#
# Nothing here binds 0.0.0.0. Both public-facing ports bind the Tailscale
# address, so the only route in is the VPS reverse proxy over the tailnet.
#
# Images are pinned by digest. `docker compose pull` will not silently move
# them, and a rebuilt gateway image starts from the same bases every time.

name: carbo-mcp

networks:
  # Carries published ports. Only the two services that must be reachable from
  # the reverse proxy sit here.
  carbo-mcp-edge:
    name: carbo-mcp-edge
    driver: bridge

  # No gateway to the host or the internet. The database is only ever on this
  # network, so nothing outside the stack can route to Postgres at all.
  carbo-mcp-internal:
    name: carbo-mcp-internal
    driver: bridge
    internal: true

volumes:
  carbo-mcp-keycloak-db:
    name: carbo-mcp-keycloak-db
  carbo-mcp-keycloak-data:
    name: carbo-mcp-keycloak-data

secrets:
  keycloak_db_password:
    file: ./secrets/keycloak_db_password
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password

services:
  # ------------------------------------------------------------------ gateway
  carbo-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: carbo-mcp-gateway:1.0.0
    container_name: carbo-mcp
    restart: unless-stopped
    depends_on:
      carbo-keycloak:
        condition: service_healthy
    networks:
      - carbo-mcp-edge
      - carbo-mcp-internal
    ports:
      - "${CARBO_MCP_BIND_ADDR}:${CARBO_MCP_PORT}:8110"
    env_file:
      - ./config/gateway.env

    # --- container hardening -------------------------------------------------
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    privileged: false
    # Writable scratch only. Nothing persists here between restarts.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m

    volumes:
      # Host facts, produced by the privileged collector on the host. Read-only:
      # the gateway can never write a snapshot, only consume one.
      - ./data/snapshots:/app/snapshots:ro
      # The single writable path in the whole container.
      - ./data/audit:/app/data/audit:rw

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ------------------------------------------------------- authorization server
  carbo-keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    image: carbo-keycloak:26.7.3
    container_name: carbo-keycloak
    restart: unless-stopped
    command:
      - start
      - --optimized
    depends_on:
      carbo-keycloak-db:
        condition: service_healthy
    networks:
      - carbo-mcp-edge
      - carbo-mcp-internal
    ports:
      - "${CARBO_MCP_BIND_ADDR}:${CARBO_KEYCLOAK_PORT}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: carbo-keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      # KC_DB_PASSWORD and KC_BOOTSTRAP_ADMIN_PASSWORD are loaded from the
      # mounted secret files by the image entrypoint. Keycloak 26 has no
      # generic *_FILE support, so they cannot be named here.
      # TLS terminates at the VPS reverse proxy; Keycloak trusts exactly one
      # hop of X-Forwarded-* and serves plain HTTP on the tailnet behind it.
      KC_HOSTNAME: ${CARBO_MCP_PUBLIC_ORIGIN}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      KC_LOG_LEVEL: info
      KC_BOOTSTRAP_ADMIN_USERNAME: carbo-admin
    secrets:
      - keycloak_db_password
      - keycloak_admin_password

    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    privileged: false

    volumes:
      - carbo-mcp-keycloak-data:/opt/keycloak/data

    healthcheck:
      # No curl in this image; Keycloak ships a JRE, so use it directly.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 384M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ------------------------------------------------------------------ database
  carbo-keycloak-db:
    image: postgres@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    # postgres:17.7-alpine
    container_name: carbo-keycloak-db
    restart: unless-stopped
    # Internal network only -- no published port, no route from outside the stack.
    networks:
      - carbo-mcp-internal
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    secrets:
      - keycloak_db_password

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Postgres drops privileges from root to the postgres user at startup.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    privileged: false

    volumes:
      - carbo-mcp-keycloak-db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
