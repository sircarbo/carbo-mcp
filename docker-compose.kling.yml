# Kling AI add-on for the Carbo MCP Gateway.
#
# NOT loaded by default. To enable, add this line to .env and redeploy:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.kling.yml
#
# Compose merges this over docker-compose.yml: the two new volumes and the
# secret are appended, config/kling.env is loaded after config/gateway.env.
# Everything else about the gateway container -- distroless, read-only root,
# no capabilities, Tailscale-only binding -- is unchanged. To disable, remove
# the COMPOSE_FILE line and redeploy; the tools vanish and no image, secret
# or file mount remains.
#
# Storage lives on the CarboFolder share (\\10.0.0.39\CarboFolder\Videos\Kling),
# which is the Windows PC's drive mounted at /mnt/carbo-folder over CIFS with
# file_mode 0666 / dir_mode 0777, so the gateway's uid 65532 can write there
# without any ownership change. Consequence: if the Windows PC (10.0.0.24) is
# off, downloads fail and this container cannot start until it is back.
#
# Before the first start:
#   mkdir -p "/mnt/carbo-folder/Videos/Kling/input"
#   sudo bash scripts/set-kling-key.sh      # writes secrets/kling_api_key, 0640 group 65532

services:
  carbo-mcp:
    env_file:
      - ./config/kling.env
    secrets:
      - kling_api_key
    volumes:
      # Approved starting images. Read-only: the gateway can never alter one.
      - /mnt/carbo-folder/Videos/Kling/input:/app/kling/input:ro
      # The only new writable path: finished videos and the .jobs ledger.
      - /mnt/carbo-folder/Videos/Kling:/app/kling/output:rw

secrets:
  kling_api_key:
    file: ./secrets/kling_api_key
